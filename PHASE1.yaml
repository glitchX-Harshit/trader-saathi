# ============================================================
# JARVIS STATES
# ============================================================

jarvis_states:

  idle:
    label: "JARVIS"
    description: "Monitoring"

  observing:
    label: "Observing"
    description: "Analyzing trading context"

  thinking:
    label: "Thinking"
    description: "Evaluating behavioral signals"

  speaking:
    label: "Speaking"
    description: "JARVIS is responding"

  stable:
    label: "Stable"
    description: "Trading behavior appears normal"

  elevated:
    label: "Elevated"
    description: "Behavior is beginning to deviate"

  warning:
    label: "Behavioral Warning"
    description: "Potential impulsive behavior detected"

# ============================================================
# TRADER BEHAVIOR ENGINE
# ============================================================

behavior_engine:

  implementation: "Deterministic rule-based system"

  purpose: >
    Detect behavioral patterns from simulated trading activity.

  states:

    stable:
      description: >
        Trader behavior remains within their normal simulated range.

    elevated:
      description: >
        Trading behavior is beginning to deviate from normal behavior.

    impulsive:
      description: >
        Trader is making unusually rapid or risky decisions.

    revenge_risk:
      description: >
        Trader has experienced a recent loss and is displaying behavior
        historically associated with revenge trading.

  signals:

    trade_loss:
      event: "TRADE_LOSS"

    trade_profit:
      event: "TRADE_PROFIT"

    rapid_reentry:
      event: "RAPID_REENTRY"

    increased_position:
      event: "POSITION_SIZE_INCREASE"

    moved_stop_loss:
      event: "STOP_LOSS_MOVED"

    consecutive_losses:
      event: "CONSECUTIVE_LOSSES"

    high_trade_frequency:
      event: "HIGH_TRADE_FREQUENCY"

# ============================================================
# BEHAVIORAL RULES
# ============================================================

behavior_rules:

  revenge_trading:

    trigger:

      all:
        - "previous_trade_result == LOSS"
        - "time_since_previous_trade < 60 seconds"
        - "position_size_change > 30%"

    resulting_state: "revenge_risk"

    severity: "high"

    confidence: 0.90

  rapid_reentry:

    trigger:
      - "time_since_previous_trade < 30 seconds"

    resulting_state: "impulsive"

    severity: "medium"

  position_increase:

    trigger:
      - "position_size_change > 30%"

    resulting_state: "elevated"

    severity: "medium"

  consecutive_losses:

    trigger:
      - "consecutive_losses >= 2"

    resulting_state: "elevated"

    severity: "medium"

# ============================================================
# MOCK TRADING ENGINE
# ============================================================

mock_trading_engine:

  purpose: >
    Simulate realistic trading behavior so the JARVIS experience can be
    demonstrated without connecting to a broker.

  events:

    - trade_opened
    - trade_closed_profit
    - trade_closed_loss
    - stop_loss_hit
    - take_profit_hit
    - position_size_increased
    - stop_loss_moved
    - rapid_reentry
    - consecutive_loss

  simulated_data:

    platforms:
      - TradingView
      - Groww
      - Zerodha
      - MT5

    symbols:
      - BTCUSDT
      - ETHUSDT
      - NIFTY
      - BANKNIFTY
      - RELIANCE
      - TCS
      - EURUSD

  controls:

    - "Simulate Profit"
    - "Simulate Loss"
    - "Simulate Revenge Trade"
    - "Increase Position"
    - "Move Stop Loss"
    - "Rapid Re-entry"
    - "Reset Session"

# ============================================================
# DEMO SCENARIO
# ============================================================

demo_scenario:

  name: "Revenge Trading Intervention"

  sequence:

    step_1:
      action: "Open simulated trade"

      jarvis:
        text: >
          "I'm monitoring your position."

    step_2:
      action: "Simulate loss"

      trade:
        pnl: -500

      jarvis:
        text: >
          "The trade closed at a loss. Your original risk was respected.
          Give yourself a moment before evaluating another setup."

    step_3:
      action: "Rapid re-entry"

      data:
        seconds_since_loss: 18

    step_4:
      action: "Increase position"

      data:
        increase_percentage: 80

    step_5:
      expected_detection:
        state: "revenge_risk"
        pattern: "possible_revenge_trading"

      jarvis:
        text: >
          "Pause. Your current behavior is significantly different from
          your normal trading pattern. You entered only 18 seconds after
          the loss and increased your position size by 80%. This resembles
          a revenge-trading pattern. I recommend stepping away before
          taking another position."

# ============================================================
# JARVIS RESPONSE ENGINE
# ============================================================

jarvis_response_engine:

  architecture:
    interface: "ResponseEngine"

  phase_1:
    implementation: "Rule-based response generation"

  future:
    implementation: "LLM-powered response generation"

  response_categories:

    informational:
      example: >
        "Your position is currently moving against you. Your original risk
        parameters are still intact."

    warning:
      example: >
        "I noticed your position size is significantly larger than your
        normal trade."

    behavioral:
      example: >
        "This looks similar to your previous revenge-trading pattern."

    intervention:
      example: >
        "Pause. You entered only 18 seconds after your previous loss and
        increased your position size by 80%."

    post_trade:
      example: >
        "The stop loss was hit. Before taking another trade, let's review
        whether the original setup was actually invalidated."

  personality:

    name: "JARVIS"

    characteristics:
      - calm
      - intelligent
      - concise
      - confident
      - respectful
      - psychologically aware
      - non-judgmental
      - professional

    communication_rules:
      - "Never insult the trader."
      - "Never shame the trader."
      - "Never overreact."
      - "Do not constantly interrupt."
      - "Speak only when intervention is meaningful."
      - "Use historical behavior when available."
      - "Explain why an intervention occurred."

