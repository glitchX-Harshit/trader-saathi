# ============================================================
# DEFINITION OF DONE
# ============================================================

definition_of_done:

  required:

    - React application launches
    - FastAPI backend launches
    - WebSocket connection works
    - JARVIS UI works
    - simulated trading session works
    - simulated profit works
    - simulated loss works
    - rapid re-entry can be simulated
    - position size increase can be simulated
    - revenge trading pattern can be detected
    - behavioral state changes correctly
    - JARVIS generates contextual response
    - JARVIS speaks response
    - event timeline updates
    - behavioral score updates
    - session can be reset
    - all trading data is clearly simulated
    - no real broker integration exists
    - no real order execution exists
    - README is complete
    - basic tests pass

# ============================================================
# MOST IMPORTANT ANTIGRAVITY INSTRUCTION
# ============================================================

final_instruction:

  >
  DO NOT BUILD THE ENTIRE LONG-TERM JARVIS PRODUCT IN THIS TASK.

  Build Phase 1 only.

  The goal is NOT to connect TradingView, Groww, Zerodha, MT5, or any broker.

  The goal is to prove the EXPERIENCE.

  The user should open the web application and feel:

  "There is an intelligent AI companion sitting beside me while I trade."

  The prototype must demonstrate:

    trading event
      ↓
    JARVIS observes
      ↓
    behavioral analysis
      ↓
    pattern detected
      ↓
    JARVIS thinks
      ↓
    JARVIS speaks
      ↓
    trader receives intervention

  Make the architecture modular so future versions can replace the mock
  observation layer with browser screen capture, OCR, computer vision,
  trading APIs, LLM reasoning, persistent trader memory, and real-time voice
  without rewriting the entire application.

  PRIORITIZE:

    1. JARVIS experience
    2. clean architecture
    3. behavioral engine
    4. voice interaction
    5. visual quality
    6. extensibility

  DO NOT PRIORITIZE:

    1. broker integrations
    2. automated trading
    3. advanced machine learning
    4. production deployment
    5. payments
    6. unnecessary infrastructure

  When Phase 1 is complete, STOP.

  Then provide:

    1. implementation summary
    2. project structure
    3. setup instructions
    4. working features
    5. mocked features
    6. known limitations
    7. recommended Phase 2

  Do not automatically continue into Phase 2.