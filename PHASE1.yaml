project:
  name: "TradeSaathi"
  codename: "JARVIS"
  version: "0.1.0"
  type: "AI Trading Psychology Companion"
  platform: "Web Application"

  vision: >
    Build a JARVIS-style AI companion for traders.

    TradeSaathi is not primarily a trading signal generator and is not an
    automated trading bot. Its core purpose is to act as an intelligent,
    real-time behavioral and psychological companion that helps traders
    maintain discipline during stressful trading situations.

    The long-term vision is for JARVIS to observe whatever trading platform
    the user is using, including TradingView, Groww, Zerodha, MetaTrader,
    broker websites, and other trading applications through explicit
    user-authorized screen sharing.

    JARVIS should understand the visible trading context, recognize
    behavioral patterns associated with impulsive decisions, maintain a
    personal behavioral profile of the trader, and communicate naturally
    through text and voice.

  critical_strategy:
    build_incrementally: true
    prototype_first: true
    do_not_overbuild: true

    rule: >
      Build only Phase 1 in this task. Do not implement the complete
      long-term product.

# ============================================================
# PRODUCT PHILOSOPHY
# ============================================================

product_philosophy:

  core_problem: >
    Traders often make irrational decisions when trading alone.
    Psychological pressure, losses, greed, fear, revenge trading,
    overconfidence, FOMO, overtrading, and impulsive position sizing can
    cause traders to violate their own trading plans.

  core_solution: >
    JARVIS acts like an intelligent trading companion sitting beside the
    trader.

    It observes trading context, understands behavioral patterns,
    communicates through voice and text, and intervenes when the trader's
    behavior significantly deviates from their normal process.

  key_positioning: >
    JARVIS does not predict the market.
    JARVIS protects the trader's decision-making process.

  product_statement: >
    "Your AI trading discipline partner."

  secondary_statement: >
    "It doesn't predict the market. It protects you from yourself."

# ============================================================
# VERY IMPORTANT SAFETY / PRODUCT BOUNDARY
# ============================================================

safety:

  phase_1:
    real_trading: false
    broker_connections: false
    order_execution: false
    order_modification: false
    automatic_buy_sell: false
    real_money: false
    real_market_data: false

  rules:
    - >
      Never place, modify, or close a real trade.

    - >
      Never connect to a real brokerage account in Phase 1.

    - >
      Clearly label all simulated trading data as SIMULATED.

    - >
      Do not claim to know the user's emotional state with certainty.

    - >
      Detect behavioral patterns rather than diagnosing emotions or
      psychological conditions.

    - >
      Never guarantee profits or trading outcomes.

    - >
      The system should encourage adherence to the user's predefined
      risk-management process rather than make trading decisions for them.

# ============================================================
# PHASE ROADMAP
# ============================================================

roadmap:

  phase_1:
    name: "JARVIS Web Prototype"
    status: "BUILD NOW"

    goal: >
      Prove the core JARVIS experience using simulated trading events.

    features:
      - React web application
      - FastAPI backend
      - WebSocket communication
      - JARVIS companion UI
      - simulated trading session
      - simulated P&L
      - behavioral state engine
      - revenge trading detection
      - contextual JARVIS responses
      - text-to-speech
      - event timeline
      - behavioral dashboard
      - mock screen observation

  phase_2:
    name: "Screen-Aware JARVIS"
    status: "FUTURE"

    features:
      - browser Screen Capture API
      - user-authorized screen sharing
      - selected-window observation
      - selected-tab observation
      - frame sampling
      - OCR
      - computer vision
      - trading UI recognition

  phase_3:
    name: "Platform-Agnostic Observation"
    status: "FUTURE"

    target_platforms:
      - TradingView
      - Groww
      - Zerodha
      - MetaTrader
      - broker web applications
      - other trading terminals

  phase_4:
    name: "Personal Behavioral Intelligence"
    status: "FUTURE"

    features:
      - trading history
      - behavioral history
      - personal trader profile
      - recurring pattern detection
      - personalized interventions
      - session psychology analysis

  phase_5:
    name: "Real-Time Voice JARVIS"
    status: "FUTURE"

    features:
      - speech recognition
      - natural voice conversation
      - low latency streaming voice
      - voice interruption
      - continuous context
      - conversational memory
      - customizable JARVIS personality

# ============================================================
# TECHNOLOGY STACK
# ============================================================

stack:

  frontend:
    framework: "React.js"
    language: "JavaScript"
    build_tool: "Vite"
    styling: "Tailwind CSS"
    state_management: "React Context or lightweight state management"
    communication: "WebSocket"
    application_type: "Web Application"

  backend:
    framework: "FastAPI"
    language: "Python"
    async: true
    communication:
      - REST
      - WebSocket

  database:
    phase_1:
      type: "SQLite"
      purpose: "Local prototype persistence"

    future:
      type: "PostgreSQL"

  voice:
    phase_1:
      type: "Browser Text-to-Speech API"

    future:
      options:
        - "OpenAI realtime voice"
        - "other low-latency TTS/STT provider"

  screen_observation:
    phase_1:
      type: "Mock"

    future:
      type: "Browser Screen Capture API"

# ============================================================
# ARCHITECTURE
# ============================================================

architecture:

  overview: >

    User
      ↓
    React JARVIS Web Interface
      ↓
    WebSocket
      ↓
    FastAPI
      ↓
    Observation Layer
      ↓
    Trading State
      ↓
    Behavioral Engine
      ↓
    JARVIS Intelligence
      ↓
    Text + Voice
      ↓
    Trader

  components:

    frontend:
      responsibilities:
        - JARVIS interface
        - floating companion
        - trading state
        - behavioral state
        - event timeline
        - conversation UI
        - voice controls
        - simulated screen
        - session controls

    backend:
      responsibilities:
        - API
        - WebSocket
        - session management
        - mock trading engine
        - behavioral engine
        - JARVIS response engine

    observation_layer:
      phase_1:
        type: "Mock Observation Layer"

      future:
        inputs:
          - screen_capture
          - OCR
          - computer_vision
          - trading_APIs
          - user_voice

    intelligence_layer:
      phase_1:
        type: "Rule-Based Behavioral Engine"

      future:
        components:
          - LLM
          - behavioral_model
          - trader_memory
          - historical_analysis

