    - interruption
    - wake_word
    - conversational_memory

# ============================================================
# SCREEN OBSERVATION
# ============================================================

screen_observation:

  phase_1:

    implementation: "MOCK ONLY"

    UI:
      title: "Screen Observation"

      label: "SIMULATED SCREEN FEED"

      show:
