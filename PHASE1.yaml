        - simulated_chart
        - simulated_symbol
        - simulated_position
        - simulated_entry
        - simulated_PnL
        - simulated_stop_loss
        - simulated_take_profit

  phase_2:

    implementation: "Browser Screen Capture API"

    user_flow:

      - "User clicks Start Observation"
      - "Browser requests screen permission"
      - "User selects screen, window, or tab"
      - "React receives MediaStream"
      - "Observation pipeline processes selected frames"

    privacy:

      - "Explicit user permission required"
      - "Visible observation status"
      - "Stop Observation button always available"
      - "Never capture without permission"
      - "Never silently capture the user's screen"

  future_pipeline:

