# ============================================================
# FUTURE PLATFORM AGNOSTIC DESIGN
# ============================================================

platform_agnostic_architecture:

  principle: >
    JARVIS must not be tightly coupled to TradingView.

    The long-term system should treat every trading application as an
    observation source.

  possible_sources:

    - TradingView
    - Groww
    - Zerodha
    - MetaTrader
    - broker web applications
    - browser-based terminals
    - desktop trading applications

  normalized_state:

    platform: "string"
    symbol: "string"
    direction: "LONG | SHORT | NONE"
    entry_price: "number"
    current_price: "number"
    position_size: "number"
    stop_loss: "number | null"
    take_profit: "number | null"
    unrealized_pnl: "number"
    session_pnl: "number"
    timestamp: "datetime"

# ============================================================
# DASHBOARD
# ============================================================

dashboard:

