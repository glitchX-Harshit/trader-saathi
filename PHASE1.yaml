      - detected_pattern
      - severity
      - recommended_action

# ============================================================
# DATA MODELS
# ============================================================

models:

  Trade:

    fields:
      id: "string"
      symbol: "string"
      direction: "string"
      entry_price: "number"
      exit_price: "number | null"
      position_size: "number"
      stop_loss: "number | null"
      take_profit: "number | null"
      pnl: "number"
      opened_at: "datetime"
      closed_at: "datetime | null"
      result: "WIN | LOSS | OPEN"

  BehavioralEvent:

    fields:
      timestamp: "datetime"
      event_type: "string"
      severity: "LOW | MEDIUM | HIGH"
      detected_pattern: "string | null"
      confidence: "number"

  TraderState:

    fields:
